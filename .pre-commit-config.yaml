# Pre-commit hooks for LANDAGRI-B Dashboard React
# Uses husky + lint-staged for JS/TS linting
# See .husky/pre-commit for the actual hook logic

repos:
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key

exclude: |
  (?x)^(
    src/data/processed/.*|
    node_modules/.*|
    dist/.*|
    .husky/.*
  )$
